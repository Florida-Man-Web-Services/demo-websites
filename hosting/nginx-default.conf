# nginx for floridamanweb demo-sites + path proxy to Arete Tutoring portal
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Arete Tutoring account portal + API (in-cluster service)
    location = /arete-tutoring {
        return 308 https://arete.floridamanweb.online/;
    }
    location /arete-tutoring/ {
        # Path proxy stripped prefix and left /static on the apex (unstyled page).
        # Canonical host is the subdomain. Do not proxy_pass a running app.
        rewrite ^/arete-tutoring/?(.*)$ https://arete.floridamanweb.online/$1 permanent;
    }

    location /api/oxford/ {
        # Same-origin dictionary proxy for customer pages. Direct pod, not the
        # public gateway — the page must not depend on a cross-origin host.
        proxy_pass http://voice-agent.theswamp.svc.cluster.local:8035;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
