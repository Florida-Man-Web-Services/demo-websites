# nginx for floridamanweb demo-sites + path proxy to Arete Tutoring portal
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Arete Tutoring account portal + API (in-cluster service)
    location = /arete-tutoring {
        return 301 /arete-tutoring/;
    }
    location /arete-tutoring/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /arete-tutoring;
        # Strip /arete-tutoring prefix when talking to the app
        proxy_pass http://arete-tutoring.theswamp.svc.cluster.local:8080/;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
